name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'

  # pgTAP and the isolation suite both need a Postgres with the migrations
  # applied, so they share one stack. The isolation tests are the point of
  # Block 1a — they create real users, sign them in, and check tenant leaks
  # under a real JWT — so CI has to run them, not just the schema assertions.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase test db
      - run: npm ci
      # Credentials come from vitest.isolation.config.ts, which pins the local
      # stack and refuses any non-loopback target.
      #
      # This does NOT run vitest bare, and the difference is the point. A
      # `Worker exited unexpectedly` crash has been observed dropping a whole
      # test file — "Test Files 12 passed (13)" — and EXITING 0, which a step
      # that checks only the exit code cannot see. `npm run test:isolation` goes
      # through scripts/verify-isolation-suite.mjs, which compares the files that
      # reported results against the files on disk and fails the build on a
      # shortfall. Do not "simplify" this back to `vitest run`.
      - run: npm run test:isolation
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # The suite drives the whole provisioning journey — sign in, forced
      # password change, suspension — so it needs a live database. The dev
      # server is started by playwright.config.ts, pointed at this stack.
      - run: supabase start
      - run: npm ci
      # The sign-in screen's picture lives in a Storage bucket, and `supabase
      # start` leaves that bucket empty — SQL cannot put bytes in one. Without
      # this, login.spec.ts's assertion that the picture renders fails on a
      # missing object rather than on anything the branch changed.
      - run: npm run seed:branding
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
